services:

  # ===================================================
  #  SERVIÇO DVWA (Damn Vulnerable Web Application)
  # =================================================== 
  dvwa:
    image: vulnerables/web-dvwa
    container_name: dvwa
    ports:
      - "8081:80"
    networks:
      - pentest-net

  # ===================================================
  #  SERVIÇO OLLAMA (Modelo de Linguagem)
  # =================================================== 
  ollama:
    image: ollama/ollama
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - pentest-net

  # ===================================================
  #  SERVIÇO PENTESTER (Nuclei, SQLMap, etc)
  # =================================================== 
  pentester:
    build: .
    container_name: pentester
    working_dir: /work
    profiles: ["tools"]
    volumes:
      - ./results:/results
      - ./wordlists:/wordlists


    networks:
      - pentest-net

  # ===================================================
  #  SERVIÇO METASPLOIT
  # =================================================== 
  metasploit:
    image: metasploitframework/metasploit-framework:latest
    container_name: metasploit
    profiles: ["tools"]
    volumes:
      - ./results:/results
    networks:
      - pentest-net

networks:
  pentest-net:
    driver: bridge

volumes:
  ollama_data:
